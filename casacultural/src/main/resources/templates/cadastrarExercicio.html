<!DOCTYPE html>
<html xmlns="w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Exercício</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/Css/styles.css">

</head>
<body>
    <header></header>
    <h1>Cadastrar Exercício</h1>
    <form action="/Exercicios" method="post" th:object="${Exercicio}">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" th:field="*{nome}" required>
        <br>
        <label for="comoSeRealiza">Como Se Realiza:</label>
        <textarea id="comoSeRealiza" name="comoSeRealiza" th:field="*{comoSeRealiza}" required></textarea>
        <br>
        <label for="GrupoMuscular">Grupo Muscular:</label>
        <input type="text" id="GrupoMuscular" name="GrupoMuscular" th:field="*{GrupoMuscular}" required>
        <br>
        <button type="submit">Cadastrar</button>
    </form>
    <a href="/" class="button-link">Voltar</a>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
